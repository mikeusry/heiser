name: Deploy contact form worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/contact-form/**'
      # service-ids.ts must stay aligned with the site service list
      - 'workers/contact-form/src/service-ids.ts'
      - 'src/lib/services.ts'
      - '.github/workflows/deploy-contact-form.yml'
  workflow_dispatch:

concurrency:
  group: deploy-contact-form
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/contact-form
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/contact-form/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
